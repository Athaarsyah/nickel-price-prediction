{% extends 'layout.html' %}

{% block body %}

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .drop-zone {
            border: 2px dashed #ccc;
            border-radius: 4px;
            padding: 20px;
            text-align: center;
            background: #f8f9fa;
            transition: all 0.3s ease;
        }
        .drop-zone.dragover {
            background: #e2e6ea;
            border-color: #0d6efd;
        }
        .table-container {
            max-height: 600px;
            overflow-y: auto;
            margin-top: 20px;
        }
        .table th {
            position: sticky;
            top: 0;
            background: white;
            z-index: 1;
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header">
                <h2>Upload CSV File</h2>
            </div>
            <div class="card-body">
                <form id="upload-form" method="post" enctype="multipart/form-data" action="{{ url_for('upload_file') }}">
                    <div class="drop-zone mb-3" id="drop-zone">
                        <p>Drag & drop CSV file here or click to select</p>
                        <input type="file" class="form-control" name="file" id="file-input" accept=".csv" style="display: none;">
                    </div>
                    <button type="submit" class="btn btn-primary">Upload</button>
                </form>
            </div>
        </div>
        <div class="container mt-5">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h2>Data</h2>
                </div>
                <div class="card-body">
                    <div class="table-container">
                        {% for table in tables %}
                            {{ table | safe }}
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
        <div class="form-group"> 
            <label for="pageSelect">Pilih Model:</label> 
            <select class="form-control" id="pageSelect"> 
              <option value="/predic.html">LSTM</option> 
              <option value="/gru.html">GRU</option> 
              <option value="/bilstm.html">BiLSTM</option> 
              <option value="/bigru.html">BiGRU</option> 
            </select> 
          </div> 
          <button class="btn btn-primary" id="goButton">Predic</button>


    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script> 
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script> 
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script> 
    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');

        // Click to select file
        dropZone.addEventListener('click', () => fileInput.click());

        // Handle drag and drop events
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length) {
                fileInput.files = files;
                if (files[0].name.endsWith('.csv')) {
                    document.getElementById('upload-form').submit();
                } else {
                    alert('Please upload a CSV file');
                }
            }
        });

        // Show filename when selected
        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (file) {
                dropZone.innerHTML = `Selected file: ${file.name}`;
            }
        });
    </script>
    <script> 
        // JavaScript untuk berpindah halaman 
        document.getElementById('goButton').addEventListener('click', function() {
             var selectedPage = document.getElementById('pageSelect').value; 
             window.location.href = selectedPage; }); </script>
</body>

{% endblock %}
